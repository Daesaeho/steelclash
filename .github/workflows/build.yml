name: Build

# Every push to a branch and every pull request: build, unit tests and both GameTest runs. Version tags are built by
# release.yml instead.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew build

      - name: Game tests (with Spartan Weaponry and Spartan Shields)
        run: ./gradlew runGameTestServer

      - name: Game tests (without the optional mods)
        run: ./gradlew runGameTestServer -PnoCompat

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: steelclash-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/
