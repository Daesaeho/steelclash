name: Release

# Push a tag like v0.1.0-beta to build, test and attach the jar to a GitHub release.
# Modrinth / CurseForge uploads run only once their tokens and project ids are configured:
#   secrets MODRINTH_TOKEN, CURSEFORGE_TOKEN; repository variables MODRINTH_ID, CURSEFORGE_ID.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test and game test
        run: |
          ./gradlew build
          ./gradlew runGameTestServer
          ./gradlew runGameTestServer -PnoCompat

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

      - name: Modrinth and CurseForge
        if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/!(*-@(sources|javadoc)).jar
          changelog-file: CHANGELOG.md
          version-type: ${{ contains(github.ref_name, 'beta') && 'beta' || 'release' }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            player-animation-library(required)
            spartan-weaponry-unofficial(optional)
            spartan-shields-unofficial(optional)
            better-combat(incompatible)
            epic-fight(incompatible)
